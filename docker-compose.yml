services:
  # Cron scheduler for running orchestrator on schedule
  scheduler:
    image: mcuadros/ofelia:latest
    container_name: idi-company-info-scheduler
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - WATCH_DIR=${WATCH_DIR:-./data/watch}
      - OUTPUT_DIR=${OUTPUT_DIR:-./data/output}
      - ARCHIVE_DIR=${ARCHIVE_DIR:-./data/archive}
      - BATCH_SIZE=${BATCH_SIZE:-5000}
      - THRESHOLD_DAYS=${THRESHOLD_DAYS:-30}
      - SCHEDULE=${SCHEDULE:-0 0 2 * * *}
    labels:
      ofelia.enabled: "true"
      # Schedule to run orchestrator (configurable via SCHEDULE env var, default: daily at 2 AM)
      ofelia.job-run.orchestrator-daily.schedule: "${SCHEDULE:-0 0 2 * * *}"
      ofelia.job-run.orchestrator-daily.image: "idi-company-information-orchestrator:latest"
      ofelia.job-run.orchestrator-daily.volume: "${WATCH_DIR:-./data/watch}:/data/watch,${OUTPUT_DIR:-./data/output}:/data/output,${ARCHIVE_DIR:-./data/archive}:/data/archive"
      ofelia.job-run.orchestrator-daily.environment: "PERMID_API_KEY=${PERMID_API_KEY},GEONAMES_USER=${GEONAMES_USER}"
      ofelia.job-run.orchestrator-daily.command: "--input-file /data/watch/shareholder_tracker_release.parquet --output-directory /data/output --archive-directory /data/archive --permid-api-key ${PERMID_API_KEY} --geonames-user ${GEONAMES_USER} --batch-size ${BATCH_SIZE} --threshold-days ${THRESHOLD_DAYS}"
      ofelia.job-run.orchestrator-daily.delete: "false"  # Keep containers to preserve logs
    restart: unless-stopped

    # Logging configuration for scheduler
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # Max size per log file
        max-file: "5"        # Keep 5 rotated log files
        compress: "true"     # Compress rotated logs

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idi-company-info-orchestrator

    # This service is managed by Ofelia scheduler
    # It will not start automatically - only when scheduled or manually triggered
    profiles:
      - manual  # Requires explicit profile to start

    # Environment variables for API credentials
    environment:
      - PERMID_API_KEY=${PERMID_API_KEY}
      - GEONAMES_USER=${GEONAMES_USER}
      - BATCH_SIZE=${BATCH_SIZE:-5000}
      - THRESHOLD_DAYS=${THRESHOLD_DAYS:-30}

    # Volume mappings for data persistence
    volumes:
      - ${WATCH_DIR:-./data/watch}:/data/watch          # Input parquet files
      - ${OUTPUT_DIR:-./data/output}:/data/output        # Output JSON files
      - ${ARCHIVE_DIR:-./data/archive}:/data/archive      # Archived processed files

    # Command that will be run by scheduler
    command: >
      --input-file /data/watch/shareholder_tracker_release.parquet
      --output-directory /data/output
      --archive-directory /data/archive
      --permid-api-key ${PERMID_API_KEY}
      --geonames-user ${GEONAMES_USER}
      --batch-size ${BATCH_SIZE}
      --threshold-days ${THRESHOLD_DAYS}

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  # Optional: One-time processing mode (disabled by default)
  orchestrator-oneshot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idi-company-info-oneshot
    profiles:
      - oneshot

    environment:
      - PERMID_API_KEY=${PERMID_API_KEY}
      - GEONAMES_USER=${GEONAMES_USER}

    volumes:
      - ${WATCH_DIR:-./data/watch}:/data/watch
      - ${OUTPUT_DIR:-./data/output}:/data/output
      - ${ARCHIVE_DIR:-./data/archive}:/data/archive

    command: >
      --input-file /data/watch/shareholder_tracker_release.parquet
      --output-directory /data/output
      --archive-directory /data/archive
      --permid-api-key ${PERMID_API_KEY}
      --geonames-user ${GEONAMES_USER}
      --batch-size 5000
      --threshold-days 30

    restart: "no"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
