services:
  # Auto-restart unhealthy containers
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: idi-company-info-autoheal
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10

  # Cron scheduler for running orchestrator on schedule
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: idi-company-info-scheduler
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - .:/app
    working_dir: /app
    environment:
      - SCHEDULE_CIK=${SCHEDULE_CIK:-0 0 2 * * *}
      - SCHEDULE_RECORD=${SCHEDULE_RECORD:-0 30 2 * * *}
    labels:
      ofelia.enabled: "true"
      ofelia.job-local.orchestrator-cik.schedule: "${SCHEDULE_CIK:-0 0 2 * * *}"
      ofelia.job-local.orchestrator-cik.command: "docker compose run --rm orchestrator-cik"
      ofelia.job-local.orchestrator-record.schedule: "${SCHEDULE_RECORD:-0 30 2 * * *}"
      ofelia.job-local.orchestrator-record.command: "docker compose run --rm orchestrator-record"
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "pgrep", "-f", "ofelia"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    # Logging configuration for scheduler
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # Max size per log file
        max-file: "5"        # Keep 5 rotated log files
        compress: "true"     # Compress rotated logs

  # Orchestrator CIK track - triggered by scheduler or manual run
  orchestrator-cik:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: idi-company-info-orchestrator-cik

    profiles:
      - manual

    environment:
      - PERMID_API_KEY=${PERMID_API_KEY:?PERMID_API_KEY is required}
      - GEONAMES_USER=${GEONAMES_USER:?GEONAMES_USER is required}
      - PERMID_BATCH_SIZE_CIK=${PERMID_BATCH_SIZE_CIK:-5000}
      - COMPANY_INFO_BATCH_SIZE_CIK=${COMPANY_INFO_BATCH_SIZE_CIK:-5000}
      - THRESHOLD_DAYS=${THRESHOLD_DAYS:-30}

    volumes:
      - ${INPUT_FILE_PATH:?INPUT_FILE_PATH is required}:/data/input/data.parquet:ro
      - ${OUTPUT_DIR:-./data/output}:/data/output
      - ${LOG_DIR:-./logs}:/logs

    entrypoint: ["/bin/sh", "-c"]
    command: >
      "python -m idi_company_info.orchestrator
      --input-file /data/input/data.parquet
      --output-directory /data/output
      --type cik
      --permid-api-key ${PERMID_API_KEY}
      --geonames-user ${GEONAMES_USER}
      --permid-batch-size ${PERMID_BATCH_SIZE_CIK:-5000}
      --company-info-batch-size ${COMPANY_INFO_BATCH_SIZE_CIK:-5000}
      --threshold-days ${THRESHOLD_DAYS:-30}
      2>&1 | tee /logs/orchestrator_cik_$(date +%Y%m%d_%H%M%S).log"

    restart: "no"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  # Orchestrator record track - triggered by scheduler or manual run
  orchestrator-record:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: idi-company-info-orchestrator-record

    profiles:
      - manual

    environment:
      - PERMID_API_KEY=${PERMID_API_KEY:?PERMID_API_KEY is required}
      - GEONAMES_USER=${GEONAMES_USER:?GEONAMES_USER is required}
      - PERMID_BATCH_SIZE_RECORD=${PERMID_BATCH_SIZE_RECORD:-5000}
      - COMPANY_INFO_BATCH_SIZE_RECORD=${COMPANY_INFO_BATCH_SIZE_RECORD:-5000}
      - THRESHOLD_DAYS=${THRESHOLD_DAYS:-30}

    volumes:
      - ${INPUT_FILE_PATH:?INPUT_FILE_PATH is required}:/data/input/data.parquet:ro
      - ${OUTPUT_DIR:-./data/output}:/data/output
      - ${LOG_DIR:-./logs}:/logs

    entrypoint: ["/bin/sh", "-c"]
    command: >
      "python -m idi_company_info.orchestrator
      --input-file /data/input/data.parquet
      --output-directory /data/output
      --type record
      --permid-api-key ${PERMID_API_KEY}
      --geonames-user ${GEONAMES_USER}
      --permid-batch-size ${PERMID_BATCH_SIZE_RECORD:-5000}
      --company-info-batch-size ${COMPANY_INFO_BATCH_SIZE_RECORD:-5000}
      --threshold-days ${THRESHOLD_DAYS:-30}
      2>&1 | tee /logs/orchestrator_record_$(date +%Y%m%d_%H%M%S).log"

    restart: "no"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
