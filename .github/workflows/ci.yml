# Main CI/CD pipeline: build, test, scan, release, deploy, and publish containers
name: CI

on:
  push:
    branches:
      - main
      - dev
      - release
      - 'release/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  REGISTRY: ghcr.io
  PROJECT_DIR: .
  IMAGE_PREFIX: idi-company-info

jobs:
  build:
    name: Build, Test, Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    outputs:
      version: ${{ steps.output.outputs.version }}
      deploy_env: ${{ steps.output.outputs.deploy_env }}
      pulumi_project: ${{ steps.output.outputs.pulumi_project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Get current version
        id: get-version
        run: |
          CURRENT=$(uv version --dry-run 2>/dev/null | awk '{print $2}')
          echo "current_version=$CURRENT" >> $GITHUB_OUTPUT

      - name: Bump alpha version (dev branch)
        if: github.ref == 'refs/heads/dev'
        run: uv version --bump patch --bump alpha

      - name: Bump rc version (release branch)
        if: startsWith(github.ref, 'refs/heads/release')
        run: |
          RELEASE_VER="${GITHUB_REF#refs/heads/release/}"
          if echo "${{ steps.get-version.outputs.current_version }}" | grep -q rc; then
            uv version --bump rc
          elif [ -n "$RELEASE_VER" ] && [ "$RELEASE_VER" != "$GITHUB_REF" ]; then
            uv version "${RELEASE_VER}rc1"
          else
            uv version --bump patch --bump rc
          fi

      - name: Bump stable version (main branch)
        if: github.ref == 'refs/heads/main'
        run: uv version --bump stable

      - name: Set version output
        id: set-version
        run: |
          V=$(uv version --dry-run 2>/dev/null | awk '{print $2}')
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Lint and format (ruff)
        run: |
          uv run ruff check . --output-format=concise
          uv run ruff format --check .

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=idi_company_info --cov-report=xml:coverage.xml --cov-report=term -v

      - name: Validate Pulumi
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          cd pulumi && uv sync --group pulumi
          uv run pulumi config set aws:region ${{ secrets.AWS_REGION || 'us-east-2' }}
          uv run pulumi stack select dev 2>/dev/null || uv run pulumi stack init dev
          uv run pulumi preview --non-interactive

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          uv pip install pip-audit
          uv run pip-audit --desc

      - name: CodeQL Analysis Init
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: CodeQL Analysis Analyze
        uses: github/codeql-action/analyze@v4

      - name: Save outputs
        id: output
        run: |
          V="${{ steps.set-version.outputs.version }}"
          echo "version=$V" >> $GITHUB_OUTPUT
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "deploy_env=prod" >> $GITHUB_OUTPUT
          else
            echo "deploy_env=dev" >> $GITHUB_OUTPUT
          fi
          PULUMI_PROJECT=$(grep '^name:' pulumi/Pulumi.yaml | awk '{print $2}')
          echo "pulumi_project=$PULUMI_PROJECT" >> $GITHUB_OUTPUT

      - name: Commit version bump
        if: |
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/dev' ||
          startsWith(github.ref, 'refs/heads/release')
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add pyproject.toml uv.lock 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: bump version to ${{ steps.set-version.outputs.version }}" && git push)

      - name: Push tag
        if: |
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/dev' ||
          startsWith(github.ref, 'refs/heads/release')
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -a "v${{ steps.set-version.outputs.version }}" -m "Version ${{ steps.set-version.outputs.version }}"
          git push origin "v${{ steps.set-version.outputs.version }}"

      - name: Create GitHub Release
        if: |
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/dev' ||
          startsWith(github.ref, 'refs/heads/release')
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          name: v${{ steps.set-version.outputs.version }}
          tag: v${{ steps.set-version.outputs.version }}
          prerelease: ${{ github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release') }}

  docker:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (orchestrator)
        id: meta-orchestrator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-orchestrator
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=raw,value=latest

      - name: Build and push orchestrator
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          file: dockerfiles/Dockerfile.orchestrator
          push: true
          tags: ${{ steps.meta-orchestrator.outputs.tags }}
          labels: ${{ steps.meta-orchestrator.outputs.labels }}

  deploy-pulumi:
    name: Deploy Pulumi
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev' ||
      startsWith(github.ref, 'refs/heads/release')
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}/pulumi
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.13"

      - name: Install Pulumi dependencies
        run: |
          cd ${{ github.workspace }}/${{ env.PROJECT_DIR }} && uv sync --group pulumi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}

      - name: Login to Pulumi S3 backend
        run: uv run pulumi login s3://${{ secrets.PULUMI_STATE_BUCKET }}

      - name: Configure Pulumi (EC2 SSH key)
        run: |
          uv run pulumi stack select ${{ needs.build.outputs.deploy_env }} 2>/dev/null || uv run pulumi stack init ${{ needs.build.outputs.deploy_env }}
          if [ -n "$EC2_SSH_KEY" ]; then
            uv run pulumi config set idi:key_name "$EC2_SSH_KEY"
          fi

      - name: Pulumi deploy
        run: uv run pulumi up --yes

  sync-ecr:
    name: Sync GHCR to ECR
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev' ||
      startsWith(github.ref, 'refs/heads/release')
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag and push orchestrator to ECR
        run: |
          ECR_REPO="${{ secrets.ECR_REPOSITORY_PREFIX || format('{0}-{1}-company-info', needs.build.outputs.pulumi_project, needs.build.outputs.deploy_env) }}-orchestrator"
          ECR_URI="${{ steps.ecr-login.outputs.registry }}/$ECR_REPO"
          GHCR_IMG="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-orchestrator"
          docker pull ${GHCR_IMG}:${{ needs.build.outputs.version }}
          docker tag ${GHCR_IMG}:${{ needs.build.outputs.version }} ${ECR_URI}:${{ needs.build.outputs.version }}
          docker tag ${GHCR_IMG}:${{ needs.build.outputs.version }} ${ECR_URI}:latest
          docker push ${ECR_URI}:${{ needs.build.outputs.version }}
          docker push ${ECR_URI}:latest
