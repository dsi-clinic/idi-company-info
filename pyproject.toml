[project]
name = "idi-company-information"
version = "0.1.0"
description = "LSEG scraper to query the `permid.org` API and return PermIds for investor CIKs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.0",
    "pyarrow>=23.0.0",
    "requests>=2.32.5",
]

[tool.ruff]
line-length = 100

lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["E501"]
