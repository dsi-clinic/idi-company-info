[project]
name = "idi-company-information"
version = "0.1.0"
description = "LSEG scraper to query the `permid.org` API and return PermIds for investor CIKs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.0",
    "pyarrow>=23.0.0",
    "requests>=2.32.5",
    "smart-open>=7.0.0",
    "watchtower>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100

lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
pulumi = [
    "pulumi>=3.220.0",
    "pulumi-aws>=7.19.0",
]
