# Pulumi.prod.yaml — PROD stack config (SCAFFOLD).
#
# Replace every REQUIRED placeholder below with real prod values before
# deploying. The processor bucket and scheduler DLQ are read from SSM
# (/idi/prod/shared/*), so they are NOT set here; the path keys below are
# bucket-relative and resolve against that shared bucket. The PermID API key is
# an SSM SecureString set out-of-band (never a committed config value):
#     aws ssm put-parameter --name /idi/prod/company-info/secrets/permid_api_key \
#       --type SecureString --value '<prod-key>' --overwrite
#
# Schedules are intentionally DISABLED (idi:schedule_enabled: "false") until the
# prod values are filled in and validated.
config:
  idi:output_dir: company-info/output
  idi:input_sources:
    - source: shareholder_tracker_cik
      input_file: "<REQUIRED: bucket-relative key, e.g. company-info/input/cik.parquet>"
      cron: cron(0 2 * * ? *)
      batch_size: "2450"
      max_requests: "1650"
    - source: commercial_debt_tracker
      input_file: "<REQUIRED: bucket-relative key, e.g. processors/cdt/debt-instruments/latest.parquet>"
      cron: cron(30 2 * * ? *)
      batch_size: "2450"
      max_requests: "1650"
    - source: corporate_subsidiaries
      input_file: "<REQUIRED: bucket-relative key, e.g. processors/corporate-structure/output/subsidiaries.parquet>"
      cron: cron(0 3 * * ? *)
      batch_size: "2450"
      max_requests: "1650"
  idi:cpu: "1024"
  idi:memory: "4096"
  idi:buffer_size: "500"
  idi:threshold_days: ""
  idi:match_score_threshold: "1"
  idi:schedule_enabled: "false"
  idi:geonames_user: "<REQUIRED: GeoNames username for geocoding>"
