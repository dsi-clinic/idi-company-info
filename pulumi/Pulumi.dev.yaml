config:
  aws:region: us-east-2
  idi:app_name: company-info
  idi:bucket_name: idi-dev-ftm2j-shared-processor-storage
  idi:output_dir: s3://idi-dev-ftm2j-shared-processor-storage/company-info/output
  idi:input_sources:
