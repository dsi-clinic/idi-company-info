      input_file: s3://idi-dev-ftm2j-shared-processor-storage/database/cdt/debt-instruments/latest.parquet
      cron: cron(30 2 * * ? *)
      batch_size: "2450"
    - source: corporate_subsidiaries
      input_file: s3://idi-dev-ftm2j-shared-processor-storage/processors/corporate-structure/output/subsidiaries.parquet
      cron: cron(0 3 * * ? *)
      batch_size: "2450"
