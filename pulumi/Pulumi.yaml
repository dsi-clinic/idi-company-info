name: idi
runtime: python
description: AWS ECS Fargate infrastructure for IDI Company Information Pipeline

config:
  aws:region:
    description: AWS region to deploy to
    value: us-east-2

  idi:app_name:
    description: Name of the application
    default: "company-info"

  # The processor bucket and scheduler DLQ are NOT declared here — they are
  # shared values read at runtime from SSM (/idi/<stack>/shared/*). The PermID
  # API key and GeoNames username are genuine secrets stored as SSM
  # SecureStrings (set out-of-band), so they are not Pulumi config values either.

  idi:cpu:
    description: Fargate task CPU units (256, 512, 1024, 2048, 4096)
    default: "1024"

  idi:memory:
    description: Fargate task memory in MiB (must be valid for chosen CPU)
    default: "4096"

  idi:schedule_enabled:
    description: Whether the EventBridge schedules are enabled
    default: "false"

  idi:output_dir:
    description: >
      S3 URI (or path) root for pipeline output. Results, the PermID cache, and
      failures are written under a per-input-source subdirectory of this root.

  idi:input_sources:
    description: >
      List of input sources to schedule. Each entry: {source, input_file, cron,
      batch_size, max_requests}. `batch_size` caps NEW identifiers resolved to
      PermIDs per run; `max_requests` is the per-run PermID enrichment-request
      budget for the company-info stage. `source` must be a valid InputSource slug (e.g.
      shareholder_tracker_cik, commercial_debt_tracker, corporate_subsidiaries);
      `input_file` is a bucket-relative key (resolved against the shared bucket
      from SSM) or a full URI (s3://, https://) used as-is.

  idi:buffer_size:
    description: Orchestrator write buffer size
    default: "500"

  idi:threshold_days:
    description: Reprocess records whose last run is older than this; empty to disable
    default: ""

  idi:match_score_threshold:
    description: Match score threshold (1 = exact match required)
    default: "1"

  idi:log_retention_days:
    description: CloudWatch log group retention in days
    default: "30"

  idi:ecr_image_count:
    description: ECR image retention count
    default: "5"
